# Actualiza el monitor y publica la página en GitHub Pages.
# Para actualizar a mano: pestaña "Actions" → "Actualizar monitor" → "Run workflow".
name: Actualizar monitor

on:
  schedule:
    # Horas en UTC (en invierno, Vitoria = UTC+1; en verano, UTC+2).
    # GitHub puede retrasar la ejecución unos minutos en horas punta.
    - cron: "17 5-22 * * *"   # cada hora, de ~06:17 a ~23:17 (invierno; en verano una hora más tarde)
  workflow_dispatch: {}       # botón "Run workflow"
  push:
    branches: [main]
    paths: ["fuentes.yaml", "temas.yaml", "efemerides.yaml", "monitor/**", "docs/index.html", "docs/ia.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Leer las fuentes
        run: python monitor/run.py
        env:
          # Correo de la redacción (opcional): Settings → Secrets and variables → Actions
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}

      - name: Resumen para la reunión (docs/reunion.html)
        run: python monitor/resumen_diario.py

      - name: Guardar el histórico en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historico.json docs/datos.json docs/archivo data/tablon_cache.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Actualización $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash -X theirs || { git checkout --theirs data/historico.json docs/datos.json 2>/dev/null; git add data/historico.json docs/datos.json docs/archivo data/tablon_cache.json; GIT_EDITOR=true git rebase --continue; }
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: despliegue
        uses: actions/deploy-pages@v4
