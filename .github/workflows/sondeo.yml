# Diagnóstico del buscador del CENDOJ. Solo se lanza a mano; guarda el resultado en la rama "diagnostico-cendoj".
name: Sondeo CENDOJ
on:
  workflow_dispatch:
    inputs:
      modo:
        description: '1 = página y scripts; 2 = pruebas de monitor/sondeo_cendoj.json'
        default: '1'
permissions:
  contents: write
jobs:
  sondeo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python monitor/sondeo_cendoj.py ${{ github.event.inputs.modo }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan diagnostico-cendoj
          git rm -rf --cached . > /dev/null
          git add -f diagnostico
          git commit -m "Sondeo CENDOJ $(date -u +'%Y-%m-%d %H:%M')"
          git push -f origin diagnostico-cendoj
