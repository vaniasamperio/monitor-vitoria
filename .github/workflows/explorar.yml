# Comprueba qué webs candidatas tienen RSS. Solo se lanza a mano.
# El resultado se guarda en la rama "diagnostico" (no toca la página).
name: Explorar fuentes

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  explorar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python monitor/descubrir.py
      - name: Guardar el informe en la rama diagnostico
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan diagnostico
          git rm -rf --cached . > /dev/null
          git add -f diagnostico
          git commit -m "Diagnóstico de fuentes $(date -u +'%Y-%m-%d %H:%M')"
          git push -f origin diagnostico
