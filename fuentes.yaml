# ============================================================
#  FUENTES DEL MONITOR  ·  Hoy por Hoy Vitoria
# ============================================================
#  Se edita desde la web de GitHub (icono del lápiz ✏️).
#  Para añadir una fuente: copia un bloque, cambia "id" (único, sin
#  espacios), "nombre" y "url", y guarda ("Commit changes").
#
#  Campos:
#    tipo       rss (lo normal) | html (web sin RSS: pon "patron_enlace")
#               | liferay (webs municipales de la plataforma foral)
#               | botha | boe | diputacion (lectores especiales)
#    seccion    instituciones | pueblos | boletines | asociaciones
#               | agenda | medios | ideas
#    local      true  -> todo lo que publica es de Vitoria/Álava
#    municipio  para webs municipales (nombre como en monitor/run.py)
#    prioridad  alta | media | baja  (ordena lo más relevante)
#    fecha_es_evento  true en agendas: la fecha es la del acto
#    activa     false para desactivarla sin borrarla
#
#  El programa respeta el robots.txt de cada web: si una web pide no
#  ser leída automáticamente, sale en rojo en "Fuentes" y no se lee.
# ============================================================

fuentes:

